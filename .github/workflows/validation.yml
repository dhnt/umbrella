name: Migrated workspace validation

# Manual only: a candidate is selected by this workflow's ref and its exact
# recursive gitlinks. No tags, releases, deployment, or private fixtures.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Run all lanes, or rerun one lane after fixing its cause'
        type: choice
        default: all
        options: [all, native-repairs, shell-repairs, fc-diagnostics, modernish-diagnostics, strict-posix-diagnostics, native, module-tests, bashy-full, bashy-diagnostics, shell-full, bash53, bash53-redir-diagnostics, free-posix, bashsharp, candidate-prepare]

      candidate_run_id:
        description: 'Successful candidate-prepare run whose immutable artifact has been reviewed and registered'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: validation-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.27.2
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'

jobs:
  fc-diagnostics:
    if: inputs.lane == 'fc-diagnostics'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Discover and execute the original interactive fc test
        shell: bash
        run: bash script/validation.sh fc-diagnostics
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  shell-repairs:
    if: inputs.lane == 'shell-repairs'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Recheck observed full-shell failures
        shell: bash
        run: bash script/validation.sh shell-repairs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-repairs-${{ matrix.os }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  native:
    if: inputs.lane == 'all' || inputs.lane == 'native'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [workspace, standalone]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      DEPENDENCY_MODE: ${{ matrix.mode }}
    steps:
      - name: Preserve committed fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Provision Linux native engine and locale prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgpgme-dev libbtrfs-dev libassuan-dev \
            libdevmapper-dev libseccomp-dev locales
          sudo localedef -i de_DE -f ISO-8859-1 de_DE.ISO-8859-1
      - name: Provision macOS native engine prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkg-config gpgme
          pkg-config --exists gpgme
      - name: Build and test existing native contracts
        shell: bash
        run: bash script/validation.sh native
      - name: Retain exact candidate and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  native-repairs:
    if: inputs.lane == 'native-repairs'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve committed fixture bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify focused native repairs
        shell: bash
        run: bash script/validation.sh native-repairs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-repairs-${{ matrix.os }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  module-tests:
    if: inputs.lane == 'all' || inputs.lane == 'module-tests'
    strategy:
      fail-fast: false
      matrix:
        mode: [workspace, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEPENDENCY_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Additional public module suites
        shell: bash
        run: bash script/validation.sh module-tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-tests-linux-${{ matrix.mode }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  bashy-full:
    if: inputs.lane == 'all' || inputs.lane == 'bashy-full' || inputs.lane == 'bashy-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      # Match Bashy's host-release.yml engine build prerequisites. The full
      # make gate deliberately compiles every supported host tag combination.
      - name: Provision native engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgpgme-dev libbtrfs-dev libassuan-dev \
            libdevmapper-dev libseccomp-dev
      - name: Selected Bashy full gate or focused diagnostics
        shell: bash
        env:
          BASHY_VALIDATION_LANE: ${{ inputs.lane == 'bashy-diagnostics' && 'bashy-diagnostics' || 'bashy-full' }}
        run: bash script/validation.sh "$BASHY_VALIDATION_LANE"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bashy-${{ inputs.lane == 'bashy-diagnostics' && 'diagnostics' || 'full' }}-linux
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  shell-full:
    if: inputs.lane == 'all' || inputs.lane == 'shell-full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Existing full interpreter suite and Linux race/confirm gates
        shell: bash
        run: bash script/validation.sh shell-full
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-full-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/umbrella-validation
            sh/artifacts/full-test
            sh/artifacts/bashpp-race-gate.txt
          if-no-files-found: error

  bash53-redir-diagnostics:
    if: inputs.lane == 'bash53-redir-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DEPENDENCY_MODE: standalone
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Original redirect measurement and separate CLI diagnostics
        shell: bash
        run: bash script/validation.sh bash53-redir-diagnostics
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bash53-redir-windows
          path: |
            ${{ runner.temp }}/umbrella-validation
            bashy/bash53-windows.log
            bashy/bash53-windows-counts.json
          if-no-files-found: error

  bash53:
    if: inputs.lane == 'all' || inputs.lane == 'bash53'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Preserve committed fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Provision Linux fixture locales
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y locales
          sudo tee -a /etc/locale.gen >/dev/null <<'EOF'
          en_US.UTF-8 UTF-8
          de_DE.UTF-8 UTF-8
          fr_FR.ISO-8859-1 ISO-8859-1
          ru_RU.CP1251 CP1251
          zh_TW BIG5
          zh_HK BIG5-HKSCS
          EOF
          sudo locale-gen
          sudo localedef --no-warnings=ascii -i ja_JP -f SHIFT_JIS ja_JP.SJIS
          LC_ALL=fr_FR.ISO8859-1 locale charmap
          LC_ALL=ja_JP.SJIS locale charmap
      - name: Native fixtures with Unix PTY or existing Windows measurement
        shell: bash
        run: |
          # The existing Windows measurement sets -mod=mod, so explicitly use
          # its standalone published-dependency contract, not workspace mode.
          if [ "$RUNNER_OS" = Windows ]; then export DEPENDENCY_MODE=standalone; fi
          bash script/validation.sh bash53
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bash53-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/umbrella-validation
            bashy/bash53-windows.log
            bashy/bash53-windows-summary.md
            bashy/bash53-windows-counts.json
          if-no-files-found: error

  free-posix:
    if: inputs.lane == 'all' || inputs.lane == 'free-posix'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Contained Bash fixtures and existing free POSIX suite aggregator
        shell: bash
        run: bash script/validation.sh free-posix
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-posix-linux
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  posix-diagnostics:
    if: inputs.lane == 'modernish-diagnostics' || inputs.lane == 'strict-posix-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Measure the selected contained POSIX diagnostic
        env:
          DIAGNOSTIC_LANE: ${{ inputs.lane }}
        run: bash script/validation.sh "$DIAGNOSTIC_LANE"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.lane }}-linux
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  candidate-prepare:
    if: inputs.lane == 'candidate-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Build and export unapproved exact candidate
        run: bash script/validation.sh candidate-prepare
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bashsharp-candidate-linux
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  bashsharp:
    if: inputs.lane == 'all' || inputs.lane == 'bashsharp'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Require reviewed candidate selection
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: test -n "$CANDIDATE_RUN_ID"
      - uses: actions/download-artifact@v5
        with:
          name: bashsharp-candidate-linux
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reviewed-candidate
      # The existing harness owns its full fixture manifest, oracle pins and
      # PASS/FAIL/PLANNED accounting. Missing external fixture prerequisites
      # fail closed; this workflow does not invent a reduced green corpus.
      - name: Full Bash# corpus and declared PLANNED accounting
        shell: bash
        env:
          CANDIDATE_BUNDLE: ${{ runner.temp }}/reviewed-candidate
        run: bash script/validation.sh bashsharp
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bashsharp-corpus-linux
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error
          include-hidden-files: true
