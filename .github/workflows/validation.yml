name: Pure B baseline-green comparison
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        default: all
        options: [all, module-tests, bash53, bash53-windows]
permissions:
  contents: read
  actions: read
concurrency:
  group: pure-b-green-${{ github.ref }}-${{ inputs.lane }}-${{ github.sha }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: go1.27.2
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'
jobs:
  module-tests:
    if: inputs.lane == 'all' || inputs.lane == 'module-tests'
    strategy:
      fail-fast: false
      matrix:
        mode: [workspace, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEPENDENCY_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Additional public module suites
        shell: bash
        run: bash script/validation.sh module-tests
      - name: Compare retained frozen baseline outcomes
        if: always()
        shell: bash
        run: python3 script/compare-baseline-green.py module-tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-tests-linux-${{ matrix.mode }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  bash53:
    if: inputs.lane == 'all' || inputs.lane == 'bash53' || inputs.lane == 'bash53-windows'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.lane == 'bash53-windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Preserve committed fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Provision Linux fixture locales
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y locales
          sudo tee -a /etc/locale.gen >/dev/null <<'EOF'
          en_US.UTF-8 UTF-8
          de_DE.UTF-8 UTF-8
          fr_FR.ISO-8859-1 ISO-8859-1
          ru_RU.CP1251 CP1251
          zh_TW BIG5
          zh_HK BIG5-HKSCS
          EOF
          sudo locale-gen
          sudo localedef --no-warnings=ascii -i ja_JP -f SHIFT_JIS ja_JP.SJIS
          LC_ALL=fr_FR.ISO8859-1 locale charmap
          LC_ALL=ja_JP.SJIS locale charmap
      - name: Native fixtures with Unix PTY or existing Windows measurement
        shell: bash
        run: |
          # The existing Windows measurement sets -mod=mod, so explicitly use
          # its standalone published-dependency contract, not workspace mode.
          if [ "$RUNNER_OS" = Windows ]; then export DEPENDENCY_MODE=standalone; fi
          bash script/validation.sh bash53
      - name: Compare retained frozen baseline outcomes
        if: always()
        shell: bash
        run: python3 script/compare-baseline-green.py bash53
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bash53-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/umbrella-validation
            bashy/bash53-windows.log
            bashy/bash53-windows-summary.md
            bashy/bash53-windows-counts.json
          if-no-files-found: error

