name: Frozen public baseline measurement

# Manual only: a candidate is selected by this workflow's ref and its exact
# recursive gitlinks. No tags, releases, deployment, or private fixtures.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Measure frozen baseline contracts; no migration fixes'
        type: choice
        default: all
        options: [all, baseline-extra, baseline-extended, baseline-final, baseline-recovered, baseline-windows-prepared, baseline-uutils-retained, native, module-tests, bashy-full, shell-full, shell-race, shell-broad-race, shell-confirm, bash53, free-posix, bashsharp, tour]

      macos_only:
        description: 'Restrict native, full-shell and Bash5.3 reruns to macOS after a Darwin-only fix'
        type: boolean
        default: false

      candidate_run_id:
        description: 'Successful candidate-prepare run whose immutable artifact has been reviewed and registered'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: validation-${{ github.ref }}-${{ inputs.lane }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.27.2
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2'

jobs:
  native:
    if: inputs.lane == 'all' || inputs.lane == 'native'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos_only && '["macos-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        mode: [workspace, standalone]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      DEPENDENCY_MODE: ${{ matrix.mode }}
    steps:
      - name: Preserve committed fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Provision Linux native engine and locale prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgpgme-dev libbtrfs-dev libassuan-dev \
            libdevmapper-dev libseccomp-dev locales
          sudo localedef -i de_DE -f ISO-8859-1 de_DE.ISO-8859-1
      - name: Provision macOS native engine prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkg-config gpgme
          pkg-config --exists gpgme
      - name: Original git fixture identity
        shell: bash
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Build and test existing native contracts
        shell: bash
        run: bash script/validation.sh native
      - name: Retain exact candidate and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  module-tests:
    if: inputs.lane == 'all' || inputs.lane == 'module-tests'
    strategy:
      fail-fast: false
      matrix:
        mode: [workspace, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEPENDENCY_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Additional public module suites
        shell: bash
        run: bash script/validation.sh module-tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-tests-linux-${{ matrix.mode }}
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  bashy-full:
    if: inputs.lane == 'all' || inputs.lane == 'bashy-full' || inputs.lane == 'bashy-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      # Match Bashy's host-release.yml engine build prerequisites. The full
      # make gate deliberately compiles every supported host tag combination.
      - name: Provision native engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgpgme-dev libbtrfs-dev libassuan-dev \
            libdevmapper-dev libseccomp-dev
      - name: Selected Bashy full gate or focused diagnostics
        shell: bash
        env:
          BASHY_VALIDATION_LANE: ${{ inputs.lane == 'bashy-diagnostics' && 'bashy-diagnostics' || 'bashy-full' }}
        run: bash script/validation.sh "$BASHY_VALIDATION_LANE"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bashy-${{ inputs.lane == 'bashy-diagnostics' && 'diagnostics' || 'full' }}-linux
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  shell-full:
    if: inputs.lane == 'all' || inputs.lane == 'shell-full'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos_only && '["macos-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Original full interpreter suite (race and confirm are independent jobs)
        shell: bash
        run: bash script/validation.sh shell-full
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-full-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/umbrella-validation
            sh/artifacts/full-test
            sh/artifacts/bashpp-race-gate.txt
          if-no-files-found: error

  shell-baseline-contracts:
    if: inputs.lane == 'all' || inputs.lane == 'shell-race' || inputs.lane == 'shell-broad-race' || inputs.lane == 'shell-confirm'
    strategy:
      fail-fast: false
      matrix:
        lane: [shell-race, shell-broad-race, shell-confirm]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Original frozen contract (independent of normal full suite)
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        shell: bash
        env:
          BASELINE_LANE: ${{ matrix.lane }}
        run: bash script/validation.sh "$BASELINE_LANE"
      - if: always() && (inputs.lane == 'all' || inputs.lane == matrix.lane)
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.lane }}-linux
          path: |
            ${{ runner.temp }}/umbrella-validation
            sh/artifacts/bashpp-race-gate.txt
          if-no-files-found: error

  bash53:
    if: inputs.lane == 'all' || inputs.lane == 'bash53'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos_only && '["macos-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Preserve committed fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Provision Linux fixture locales
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y locales
          sudo tee -a /etc/locale.gen >/dev/null <<'EOF'
          en_US.UTF-8 UTF-8
          de_DE.UTF-8 UTF-8
          fr_FR.ISO-8859-1 ISO-8859-1
          ru_RU.CP1251 CP1251
          zh_TW BIG5
          zh_HK BIG5-HKSCS
          EOF
          sudo locale-gen
          sudo localedef --no-warnings=ascii -i ja_JP -f SHIFT_JIS ja_JP.SJIS
          LC_ALL=fr_FR.ISO8859-1 locale charmap
          LC_ALL=ja_JP.SJIS locale charmap
      - name: Native fixtures with Unix PTY or existing Windows measurement
        shell: bash
        run: |
          # The existing Windows measurement sets -mod=mod, so explicitly use
          # its standalone published-dependency contract, not workspace mode.
          if [ "$RUNNER_OS" = Windows ]; then export DEPENDENCY_MODE=standalone; fi
          bash script/validation.sh bash53
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bash53-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/umbrella-validation
            bashy/bash53-windows.log
            bashy/bash53-windows-summary.md
            bashy/bash53-windows-counts.json
          if-no-files-found: error

  free-posix:
    if: inputs.lane == 'all' || inputs.lane == 'free-posix'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Contained Bash fixtures and existing free POSIX suite aggregator
        shell: bash
        run: bash script/validation.sh free-posix
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-posix-linux
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  corpus-prerequisites:
    if: inputs.lane == 'all' || inputs.lane == 'bashsharp' || inputs.lane == 'tour'
    runs-on: ubuntu-latest
    steps:
      - name: Report unfulfilled frozen corpus prerequisite explicitly
        run: |
          mkdir -p "$RUNNER_TEMP/umbrella-validation"
          printf '%s\n' 'BLOCKED: frozen Bash# corpus/Tour needs an independently authenticated baseline artifact and its original registry/layout. No newer harness, approval row, assertions, or evidence are substituted. These tests have not run.' > "$RUNNER_TEMP/umbrella-validation/coverage.md"
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-corpus-prerequisites
          path: ${{ runner.temp }}/umbrella-validation
          if-no-files-found: error

  baseline-extra:
    if: inputs.lane == 'baseline-extra'
    strategy:
      fail-fast: false
      matrix:
        contract: [focused-1, focused-2, focused-4, filebrowser-race, gotreesitter-race, yamux, readline, bonsai, gfy, nadir, nadir-onnx, sh-cross, bashy-cross, confirm-verbose]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Original frozen contract, independently accounted
        shell: bash
        env:
          BASELINE_CONTRACT: ${{ matrix.contract }}
        run: bash script/baseline-extra.sh "$BASELINE_CONTRACT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-extra-${{ matrix.contract }}
          path: ${{ runner.temp }}/baseline-extra
          if-no-files-found: error

  baseline-extended:
    if: inputs.lane == 'baseline-extended'
    strategy:
      fail-fast: false
      matrix:
        contract: [gotreesitter-cgo-smoke, gotreesitter-cgo-exhaustive, gotreesitter-report, yoke-crossvet, ycode-dag, bashy-oci-policy, bashy-installed-stress, bashy-self-container]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.contract == 'gotreesitter-cgo-smoke' || matrix.contract == 'gotreesitter-report') && 20 || matrix.contract == 'gotreesitter-cgo-exhaustive' && 120 || 180 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Original native build prerequisites
        if: matrix.contract == 'yoke-crossvet' || matrix.contract == 'ycode-dag' || matrix.contract == 'bashy-self-container'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libbtrfs-dev libgpgme-dev libsqlite3-dev podman
      - name: Original frozen extended contract
        shell: bash
        env:
          BASELINE_CONTRACT: ${{ matrix.contract }}
        run: bash script/baseline-extra.sh "$BASELINE_CONTRACT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-extended-${{ matrix.contract }}
          path: ${{ runner.temp }}/baseline-extra
          if-no-files-found: error

  baseline-final:
    if: inputs.lane == 'baseline-final'
    strategy:
      fail-fast: false
      matrix:
        contract:
        - bashy-zsh
        - bashy-uutils-safety
        - bashy-parallel
        - bashy-license
        - bashy-vulnerabilities
        - outpost-license
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.2
        cache: false
    - name: Original native prerequisites and pinned Zsh reference
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends libbtrfs-dev libgpgme-dev libsqlite3-dev zsh

        '
    - name: Original final frozen contract
      shell: bash
      env:
        BASELINE_CONTRACT: ${{ matrix.contract }}
      run: bash script/baseline-extra.sh "$BASELINE_CONTRACT"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: baseline-final-${{ matrix.contract }}
        path: ${{ runner.temp }}/baseline-extra
        if-no-files-found: error
  baseline-quickstart:
    runs-on: ubuntu-latest
    env:
      BASHY_OCI: docker
      GOWORK: 'off'
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - name: Confirm a usable container engine is present (this gate must run)
      shell: bash
      run: docker info >/dev/null
    - name: Build and run the three FROM-scratch images
      shell: bash
      timeout-minutes: 30
      run: 'set -euxo pipefail

        scripts/quickstart-container-smoke.sh 2>&1 | tee /tmp/quickstart.log

        grep -q ''^quickstart-container: OK'' /tmp/quickstart.log

        '
    - name: Publish sizes and SBOM to the job summary
      if: always()
      shell: bash
      run: "{\n  echo '## Bash# three FROM-scratch delivery modes'\n  echo\n  echo 'Measured on this run, inside the images (`docker image\
        \ inspect` / `docker save | gzip -9` / `wc -c` / `go version -m`).'\n  echo\n  echo '| kind | line |'\n  echo '|---|---|'\n  grep\
        \ -E '^quickstart-container: (SIZE|SBOM)' /tmp/quickstart.log 2>/dev/null \\\n    | sed -E 's/^quickstart-container: (SIZE|SBOM)\
        \ /| \\1 | /; s/$/ |/' \\\n    || echo '| (none) | smoke produced no size/SBOM lines \u2014 see the job log |'\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: baseline-quickstart
        path: /tmp/quickstart.log
        if-no-files-found: warn
    if: inputs.lane == 'baseline-final'
    defaults:
      run:
        working-directory: bashy
  baseline-airgap:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.lane == 'baseline-recovered' && '[{"runner":"ubuntu-latest","arch":"amd64"}]' || '[{"runner":"ubuntu-latest","arch":"amd64"},{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.2
    - name: Build bashy
      shell: bash
      run: make build
    - name: Scrub the host engines off PATH (bashy must provision its own podman)
      shell: bash
      run: "set -euo pipefail\nscrub=$RUNNER_TEMP/scrub-path\nmkdir -p \"$scrub\"\n# setup-go's dir FIRST: /usr/bin carries the distro\
        \ go, which is older than go.mod's floor\nfor d in \"$(dirname \"$(command -v go)\")\" /usr/local/sbin /usr/local/bin /usr/sbin\
        \ /usr/bin /sbin /bin; do\n  for f in \"$d\"/*; do\n    b=$(basename \"$f\")\n    case \"$b\" in podman|docker|podman-remote|buildah|skopeo|nerdctl)\
        \ continue ;; esac\n    [ -e \"$scrub/$b\" ] || [ -L \"$scrub/$b\" ] || ln -s \"$f\" \"$scrub/$b\"\n  done\ndone\necho \"$scrub\" > \"$RUNNER_TEMP/scrub-path.txt\"\
        \n! PATH=$scrub command -v podman\n"
    - name: The one Linux host fact (docs/airgap-image.md "What the host needs")
      shell: bash
      run: "# Ubuntu 24.04+ moves an unconfined process that creates a user namespace\n# into the `unprivileged_userns` AppArmor profile,\
        \ which denies exec of\n# /proc/self/exe \u2014 rootless podman from an unpackaged path dies with\n# \"failed to reexec: Permission\
        \ denied\" (audit-log proven on this runner).\n# The distro podman escapes via its packaged profile; ours has none.\nsudo sysctl\
        \ -w kernel.apparmor_restrict_unprivileged_userns=0\n"
    - name: bashy podman provisions itself (cold cache, no engine on PATH)
      shell: bash
      run: 'set -euo pipefail

        export PATH=$(cat "$RUNNER_TEMP/scrub-path.txt")

        export BASHY_BIN_CACHE=$HOME/.cache/bashy-227 BASHY_TELEMETRY_QUIET=1

        # a FRESH runtime dir: the runner image''s own podman leaves rootless

        # state under /run/user/<uid>/libpod; bashy''s podman would join that

        # foreign namespace and die on `execvp(/proc/self/exe)` ("failed to

        # reexec: Permission denied"). A clean host has no such state.

        export XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg && mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

        bin/bashy podman --version

        bin/bashy podman version

        '
    - name: Build the image and run the airgap gate
      shell: bash
      timeout-minutes: 30
      run: 'set -euo pipefail

        export PATH=$(cat "$RUNNER_TEMP/scrub-path.txt")

        export BASHY_BIN_CACHE=$HOME/.cache/bashy-227 BASHY_TELEMETRY_QUIET=1 XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg

        BASHY_IMAGE_ARCH=${{ matrix.arch }} scripts/airgap-container-smoke.sh 2>&1 | tee "$RUNNER_TEMP/airgap.log"

        grep -q ''^airgap: PASS'' "$RUNNER_TEMP/airgap.log"

        '
    - name: Sizes to the job summary
      if: always()
      shell: bash
      run: "export PATH=$(cat \"$RUNNER_TEMP/scrub-path.txt\" 2>/dev/null || echo \"$PATH\")\nexport BASHY_BIN_CACHE=$HOME/.cache/bashy-227\
        \ BASHY_TELEMETRY_QUIET=1 XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg\nimg=$(grep -o 'localhost/bashy:[^ ]*' \"$RUNNER_TEMP/airgap.log\"\
        \ | head -1 || true)\n{\n  echo \"## airgap image \u2014 linux/${{ matrix.arch }}\"\n  grep '^airgap: rows=' \"$RUNNER_TEMP/airgap.log\"\
        \ || echo '(no row summary \u2014 see the log)'\n  if [ -n \"$img\" ]; then\n    echo \"- image: \\`$img\\`\"\n    echo \"- uncompressed:\
        \ $(bin/bashy podman image inspect \"$img\" --format '{{.Size}}' | awk '{printf \"%.1f MB\", $1/1048576}')\"\n    echo \"- compressed:\
        \ $(bin/bashy podman save \"$img\" | gzip -9 | wc -c | awk '{printf \"%.1f MB\", $1/1048576}')\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: baseline-airgap-${{ matrix.arch }}
        path: ${{ runner.temp }}/airgap.log
        if-no-files-found: warn
    if: inputs.lane == 'baseline-final' || inputs.lane == 'baseline-recovered'
    defaults:
      run:
        working-directory: bashy
    env:
      GOWORK: 'off'
  baseline-windows-probes:
    if: inputs.lane == 'baseline-final' || inputs.lane == 'baseline-recovered' || inputs.lane == 'baseline-windows-prepared'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: ${{ inputs.lane == 'baseline-windows-prepared' && 'false' || 'recursive' }}
        persist-credentials: false
    - name: Hydrate only the three exact gitlinks consumed by platform probes
      if: inputs.lane == 'baseline-windows-prepared'
      shell: bash
      working-directory: .
      run: git submodule update --init --recursive bashy yoke coreutils
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.2
        cache-dependency-path: bashy/go.sum
    - name: Measure targeted Windows platform behavior
      if: matrix.probe_mode != 'pipe'
      shell: bash
      run: ./scripts/ci-windows-filetime-probe.sh '${{ matrix.probe_mode }}'
    - name: Hydrate the original pinned module before querying its source directory
      if: matrix.probe_mode == 'pipe'
      shell: bash
      run: go mod download github.com/qiangli/coreutils
    - name: Check live and closed Windows named-pipe metadata
      if: matrix.probe_mode == 'pipe'
      shell: bash
      run: 'set -o pipefail

        (cd "$(go list -m -f ''{{.Dir}}'' github.com/qiangli/coreutils)" && go test -v -run ''^TestLstatNamedPipeTracksServerLifetime$''
        ./tool) 2>&1 | tee windows-pipe-probe.log

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: baseline-windows-${{ matrix.probe_mode }}
        path: 'bashy/windows-filetime-probe.log

          bashy/windows-locale-probe.log

          bashy/windows-pipe-probe.log

          '
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        probe_mode: ${{ fromJSON(inputs.lane == 'baseline-recovered' && '["pipe"]' || inputs.lane == 'baseline-windows-prepared' && '["filetime","locale"]' || '["filetime","locale","pipe"]') }}
    defaults:
      run:
        working-directory: bashy
    env:
      GOWORK: 'off'

  baseline-recovered:
    if: inputs.lane == 'baseline-recovered' || inputs.lane == 'baseline-uutils-retained'
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(inputs.lane == 'baseline-uutils-retained' && '["uutils"]' || '["uutils","yash","posix-loader"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Recovered original fixture and separate build diagnostics
        shell: bash
        env:
          BASELINE_CONTRACT: ${{ matrix.contract }}
        run: bash script/baseline-recovered.sh "$BASELINE_CONTRACT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-recovered-${{ matrix.contract }}
          path: ${{ runner.temp }}/baseline-recovered
          if-no-files-found: error
